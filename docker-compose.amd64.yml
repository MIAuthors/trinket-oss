# Local override for Intel hosts (e.g. the intelmini box): the base
# docker-compose.gcr.yml pins linux/arm64 (Apple Silicon), which forces QEMU
# emulation on amd64 and is so slow the app times out reaching the Firestore
# emulator on boot. Run natively instead:
#   docker compose -f docker-compose.gcr.yml -f docker-compose.amd64.yml up --build -d
services:
  firebase:
    platform: linux/amd64
  app:
    platform: linux/amd64
